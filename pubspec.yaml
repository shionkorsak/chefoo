name: chefoo
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  google_maps_flutter_web: ^0.3.3
  google_maps_flutter: ^2.2.3
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  provider: ^6.0.5
  url_launcher: ^6.1.7
  geolocator: ^10.1.0
  geolocator_web: ^2.2.1
  iconsax_plus: ^1.0.0
  firebase_core: 
  firebase_auth: ^5.5.2
  google_sign_in: ^6.3.0
  flutter_signin_button: ^2.0.0
  cloud_firestore: 
  cloud_functions: ^5.5.0
  marquee: ^2.2.3 #for horizontall text animation
  shared_preferences: ^2.5.3
  flutter_animate: ^4.2.0
  location: ^5.0.3
  percent_indicator: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^4.0.0
  #flutter_launcher_icons: ^0.14.1
  #flutter_native_splash: ^2.4.3
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/svgs/
    - assets/images/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: KindSans
      fonts:
        - asset: assets/fonts/kindsans/kindsans-thin.ttf
          weight: 100
        - asset: assets/fonts/kindsans/kindsans-thinitalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/kindsans/kindsans-light.ttf
          weight: 300
        - asset: assets/fonts/kindsans/kindsans-lightitalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/kindsans/kindsans-regular.ttf
          weight: 400
        - asset: assets/fonts/kindsans/kindsans-regularitalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/kindsans/kindsans-medium.ttf
          weight: 500
        - asset: assets/fonts/kindsans/kindsans-mediumitalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/kindsans/kindsans-semibold.ttf
          weight: 600
        - asset: assets/fonts/kindsans/kindsans-semibolditalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/kindsans/kindsans-bold.ttf
          weight: 700
        - asset: assets/fonts/kindsans/kindsans-bolditalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/kindsans/kindsans-heavy.ttf
          weight: 800
        - asset: assets/fonts/kindsans/kindsans-heavyitalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/kindsans/kindsans-black.ttf
          weight: 900
        - asset: assets/fonts/kindsans/kindsans-blackitalic.ttf
          weight: 900
          style: italic

    - family: Helvetica
      fonts:
        - asset: assets/fonts/helvetica/Helvetica.ttf
          weight: 400
        - asset: assets/fonts/helvetica/Helvetica-Bold.ttf
          weight: 700
        - asset: assets/fonts/helvetica/Helvetica-BoldOblique.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/helvetica/Helvetica-Oblique.ttf
          weight: 400
          style: italic

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package