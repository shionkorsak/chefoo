name: flutter_skeleton
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  #flutter_launcher_icons: ^0.14.1
  #flutter_native_splash: ^2.4.3
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: KindSans
      fonts:
        - asset: assets/fonts/Font/kindsans-thin.ttf
          weight: 100
        - asset: assets/fonts/Font/kindsans-thinitalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Font/kindsans-light.ttf
          weight: 300
        - asset: assets/fonts/Font/kindsans-lightitalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Font/kindsans-regular.ttf
          weight: 400
        - asset: assets/fonts/Font/kindsans-regularitalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Font/kindsans-medium.ttf
          weight: 500
        - asset: assets/fonts/Font/kindsans-mediumitalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Font/kindsans-semibold.ttf
          weight: 600
        - asset: assets/fonts/Font/kindsans-semibolditalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Font/kindsans-bold.ttf
          weight: 700
        - asset: assets/fonts/Font/kindsans-bolditalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Font/kindsans-heavy.ttf
          weight: 800
        - asset: assets/fonts/Font/kindsans-heavyitalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Font/kindsans-black.ttf
          weight: 900
        - asset: assets/fonts/Font/kindsans-blackitalic.ttf
          weight: 900
          style: italic

    - family: Helvetica
      fonts:
        - asset: assets/fonts/Font/Helvetica.ttf
          weight: 400
        - asset: assets/fonts/Font/Helvetica-Bold.ttf
          weight: 700
        - asset: assets/fonts/Font/Helvetica-BoldOblique.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Font/Helvetica-Oblique.ttf
          weight: 400
          style: italic
          
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
